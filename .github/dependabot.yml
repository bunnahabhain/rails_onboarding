version: 2
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
    timezone: America/Toronto
  open-pull-requests-limit: 10
  groups:
    # Listed first so the catch-all groups below don't claim these:
    # a dependency lands in the first group it matches.
    linters:
      patterns:
      - "rubocop"
      - "rubocop-*"
      - "standard"
      - "standard-*"
    bundler:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
    bundler-major:
      patterns:
      - "*"
      update-types:
      - major
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
    day: monday
    time: "09:00"
    timezone: America/Toronto
  open-pull-requests-limit: 10
  groups:
    github-actions:
      patterns:
      - "*"
      update-types:
      - minor
      - patch
    github-actions-major:
      patterns:
      - "*"
      update-types:
      - major
